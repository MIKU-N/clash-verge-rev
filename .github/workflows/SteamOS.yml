name: Build for SteamOS (AppImage)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # 修复点 1: 针对 Tauri v2 + SteamOS，必须安装 libsoup-3.0 和 webkit2gtk-4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9 # 保持使用稳定的 v9，或者你可以尝试不写 version 让它自动读取 package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 修复点 2: 配合 Vite 7+ 使用 Node 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        # 修复点 3: 去掉 frozen-lockfile 以避免跨平台 lock 文件不匹配问题
        run: pnpm install

      - name: Download Sidecar Binaries (Prebuild)
        # 修复点 4: 你的 package.json 里下载内核的脚本叫 "prebuild"
        run: pnpm run prebuild

      - name: Build AppImage
        # 使用 run build 可以继承 package.json 里设置的内存限制 (max-old-space-size)
        run: pnpm run build --bundles appimage

      - name: Rename Artifact for SteamOS
        run: |
          find target/release/bundle/appimage -name "*.AppImage" -exec mv {} ClashVerge-SteamOS.AppImage \;
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashVerge-SteamOS
          path: ClashVerge-SteamOS.AppImage

        #  将文件上传到 GitHub Release
      - name: Upload to Release
        # 仅在检测到 Tag 推送时运行，避免手动触发时报错
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 指定要上传的文件路径
          files: ClashVerge-SteamOS.AppImage
          # 如果是 rc 版本，标记为预发布
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
