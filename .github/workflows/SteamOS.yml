name: Build for SteamOS (AppImage)

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发（如 v1.0.0）
  workflow_dispatch: # 允许手动点按钮触发

jobs:
  build-linux:
    runs-on: ubuntu-22.04 # 使用较旧的 Ubuntu 以确保 glibc 兼容性更好（适配 SteamOS）
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # 安装 Tauri 在 Linux 下编译所需的库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 建议使用 LTS 版本
          cache: 'pnpm' # 或 'pnpm' / 'yarn'，根据项目 lock 文件调整

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        # 如果项目用的是 pnpm 或 yarn，请相应修改命令
        run: pnpm install

      - name: Build AppImage
        # Tauri 构建命令，--target 默认是 x86_64-unknown-linux-gnu
        # 这会自动生成 .AppImage 和 .deb
        run: pnpm tauri build -- --bundles appimage

      - name: Rename Artifact for SteamOS
        # 重命名文件以便识别
        run: |
          cd src-tauri/target/release/bundle/appimage
          mv *.AppImage ClashVerge-SteamOS.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashVerge-SteamOS
          path: src-tauri/target/release/bundle/appimage/ClashVerge-SteamOS.AppImage
